  {day:4, periods:[3,4], subj:"语文"},  /* 周四上午3、4节 */
  {day:2, periods:[5,6], subj:"英语"},  /* 周二下午5、6节 */
  {day:3, periods:[5,6], subj:"数学"}   /* 周三下午5、6节 */
];
function meetingFor(t, day, period){
  for(var i=0;i<MEETINGS.length;i++){
    var m = MEETINGS[i];
    if(m.day===day && m.periods.indexOf(period)>=0){
      var has = T[t].some(function(e){ return e[2]===m.subj; });
      if(has) return m.subj + "科组会";
    }
  }
  return null;
}

var DAYS = ["周一","周二","周三","周四","周五"];

/* 班级列表：一年级在前 */
function allClasses(){
  var set = {}, arr=[];
  Object.keys(T).forEach(function(t){ T[t].forEach(function(e){ if(!set[e[3]]){set[e[3]]=1;arr.push(e[3]);} }); });
  arr.sort(function(a,b){
    function key(x){ return x.charCodeAt(0)*100 + parseInt(x.match(/\d+/)[0]); }
    return key(a)-key(b);
  });
  return arr;
}
var CLASSES = allClasses().filter(function(c){ return c.charAt(0)==="一"; }); /* 输入项仅一年级，其他年级只用于判断忙闲 */

var state = { cls:"一(8)", day:1, period:1, weekMode:0, date:todayStr() }; /* weekMode: 0按日期 1单 2双 */

function todayStr(){
  var n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
/* 按规则：2026-09-01起为第1周（单周），每7天滚动轮换 */
function weekInfoOfDate(ds){
  var p = ds.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var days = Math.floor((d - new Date(2026,8,1))/86400000);
  if(days < 0) return { week:0, type:1 };
  var wk = Math.floor(days/7)+1;
  return { week: wk, type: (wk%2===1) ? 1 : 2 };
}
function curWeekType(){ return state.weekMode===0 ? weekInfoOfDate(state.date).type : state.weekMode; }
function weekMatch(e,wt){ return e[4]===0 || e[4]===wt; }
function weekLabel(w){ return w===1?"(单)":(w===2?"(双)":""); }

function setWeek(m){
  state.weekMode = m;
  ["wAuto","wOdd","wEven"].forEach(function(id,i){
    document.getElementById(id).className = ((i===0&&m===0)||(i===1&&m===1)||(i===2&&m===2)) ? "on" : "";
  });
  updateWeekTip(); render();
}
function updateWeekTip(){
  var wt = curWeekType();
  var p = state.date.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var info = weekInfoOfDate(state.date);
  var dow = d.getDay();
  var dowTxt = ["周日","周一","周二","周三","周四","周五","周六"][dow];
  var wkTxt = info.week===0 ? "开学前（按单周）" : "第"+info.week+"周";
  document.getElementById("weekTip").innerHTML =
    "📅 "+state.date+"（"+dowTxt+"） · "+wkTxt+" · 按<b>"+(wt===1?"单周":"双周")+"</b>计算"+(dow===0||dow===6?" ⚠️所选日期是周末":"");
}

function renderChips(){
  var c = document.getElementById("clsChips"); c.innerHTML="";
  CLASSES.forEach(function(cls){
    var b = document.createElement("button");
    b.className = "chip"+(cls===state.cls?" on":""); b.textContent = cls;
    b.onclick = function(){ state.cls=cls; renderChips(); render(); };
    c.appendChild(b);
  });
  var d = document.getElementById("dayChips"); d.innerHTML="";
  DAYS.forEach(function(dn,i){
    var b = document.createElement("button");
    b.className = "chip"+(i+1===state.day?" on":""); b.textContent = dn;
    b.onclick = function(){ state.day=i+1; renderChips(); render(); };
    d.appendChild(b);
  });
  var p = document.getElementById("periodChips"); p.innerHTML="";
  for(var i=1;i<=6;i++){
    var b = document.createElement("button");
    b.className = "chip"+(i===state.period?" on":"");
    b.innerHTML = "第"+["一","二","三","四","五","六"][i-1]+"节<small>"+PERIOD_TIME[i]+"</small>";
    b.onclick = function(k){ return function(){ state.period=k; renderChips(); render(); }; }(i);
    p.appendChild(b);
  }
}

function teachersOfClass(cls){
  var set = {};
  Object.keys(T).forEach(function(t){
    T[t].forEach(function(e){ if(e[3]===cls) set[t]=1; });
  });
  return Object.keys(set);
}
function lessonAt(t, day, period, wt){
  for(var i=0;i<T[t].length;i++){
    var e=T[t][i];
    if(e[0]===day && e[1]===period && weekMatch(e,wt)) return e;
  }
  return null;
}
function subjectsIn(cls, t){
  var s={};
  T[t].forEach(function(e){ if(e[3]===cls) s[e[2]]=1; });
  return Object.keys(s).join("、");
}

function render(){
  var wt = curWeekType();
  var cls=state.cls, day=state.day, period=state.period;
  var CN = ["一","二","三","四","五","六"];
  /* 本班这节课：显示科目与任课老师（通用，面向所有老师） */
  var who = [];
  Object.keys(T).forEach(function(t){
    var e = lessonAt(t,day,period,wt);
    if(e && e[3]===cls) who.push({t:t,e:e});
  });
  var pTxt = DAYS[day-1]+' 第'+CN[period-1]+'节 '+PERIOD_TIME[period]+' · '+cls;
  var html = '<div class="card"><h2>本班这节课</h2>';
  if(who.length){
    who.forEach(function(x){
      html += '<div class="mylesson"><span class="tag">'+x.e[2]+weekLabel(x.e[4])+'</span><span class="info">'+pTxt+' · '+x.t+'</span></div>';
    });
  } else {
    html += '<div class="empty">'+pTxt+'，本班暂无安排。</div>';
  }
  html += '</div>';

  var ts = teachersOfClass(cls);
  var ok=[];
  ts.forEach(function(t){
    var e = lessonAt(t,day,period,wt);
    if(!e){ ok.push(t); }
  });

  html += '<div class="card"><h2>✅ 可以找他们换（本节没课）</h2>';
  if(ok.length){
    html += '<div class="ok-grid">';
    ok.forEach(function(t){
      var mt = meetingFor(t,day,period);
      html += '<div class="ok-item" onclick="openSheet(\''+t+'\')"><div class="name">'+t+' ›</div><div class="subj">教本班：'+subjectsIn(cls,t)+'</div>';
      if(mt) html += '<div class="mt">⚠️ 该时段可能有'+mt+'，建议先沟通确认</div>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty">这个时段所有教本班的老师都有课。</div>';
  }
  html += '</div>';

  document.getElementById("result").innerHTML = html;
}

function openSheet(t){
  var wt = curWeekType();
  document.getElementById("sheetName").textContent = t+" 的课表";
  document.getElementById("sheetWeek").textContent = "当前按"+(wt===1?"单周":"双周")+"显示";
  var rows = {};
  T[t].forEach(function(e){
    var k = e[0]+"-"+e[1];
    if(!rows[k]) rows[k]=[];
    rows[k].push(e);
  });
  var html = '<table class="tt"><tr><th style="width:15%"></th>';
  DAYS.forEach(function(d){ html+='<th>'+d+'</th>'; });
  html += '</tr>';
  for(var p=1;p<=6;p++){
    html += '<tr><td class="rowh">第'+["一","二","三","四","五","六"][p-1]+'<br>'+PERIOD_TIME[p]+'</td>';
    for(var d=1;d<=5;d++){
      var es = rows[d+"-"+p];
      if(!es){ html+='<td></td>'; continue; }
      var hasCur = es.some(function(e){ return weekMatch(e,wt); });
      var cells = es.map(function(e){
        return '<div class="s">'+e[2]+weekLabel(e[4])+'</div><div class="c">'+e[3]+'</div>';
      }).join('');
      html += '<td class="'+(hasCur?'cur':'off')+'">'+cells+'</td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById("sheetTable").innerHTML = html;
  document.getElementById("mask").classList.add("show");
}
function closeSheet(){ document.getElementById("mask").classList.remove("show"); }

var datePick = document.getElementById("datePick");
datePick.value = state.date;
datePick.onchange = function(){
  state.date = this.value || todayStr();
  state.weekMode = 0; /* 回到按日期自动判断 */
  ["wAuto","wOdd","wEven"].forEach(function(id,i){
    document.getElementById(id).className = (i===0) ? "on" : "";
  });
  var p = state.date.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var dow = d.getDay();
  if(dow>=1 && dow<=5) state.day = dow; /* 自动联动到所选日期的星期 */
  updateWeekTip(); renderChips(); render();
};
renderChips();
updateWeekTip();
render();
</script>
</body>
</html>
